name: flutter_portfolio
description: A beautiful personal portfolio app.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/profile.jpg
    - assets/port.png
    - assets/face.png
    - assets/gitshub.png
    - assets/insta.png
    - assets/Galad.png
    - assets/Euventured.png
